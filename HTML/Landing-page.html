<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="CSS\Landing_page.css">
  </head>
  <body>
       <div class="header">
        <div class = "header-content">

            <div class = "logo">
                <p>
                company name    
                <p>
            </div>        
            <div class = "booking-content">
                <p>
                    Booking
                </p>
                   <p>
                    See Rooms
                </p>
                   <p>
                    Contact
                </p>
            </div>
            <div class = "header-buttons">
                <button class = "sign-header-button"> Sign in </button>
               <button class = "register-header-button"> Register </button>
            </div>
        </div>
       </div> 
       
       <div class = "top-content">
        <div class = "top-name">
            <p>
                Company Name
            </p>
        </div>
        <div class = "Search-Form">
            <form>
              <label for="destination">Destination:</label><br>
              <input type="text" id="destination" name="destination"><br><br>

              <label for="checkin">Check-In:</label><br>
              <input type="date" id="checkin" name="checkin"><br><br>

              <label for="checkout">Check-Out:</label><br>
              <input type="date" id="checkout" name="checkout"><br><br>

              <label for="guests">Guests:</label><br>
              <input type="number" id="guests" name="guests" min="1">
            </form>

        </div>
       </div>
  </body>
</html>
