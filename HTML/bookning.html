<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="CSS/booking.css">
    <script src="JS/booking.js" type="text/javascript"></script>
  </head>
  <body>

    <div class="header">
      <div class="header-content">

        <div class="logo">
          <p>company name</p>
        </div>        

        <div class="booking-content">
          <p>Booking</p>
          <p>See Rooms</p>
          <p>Contact</p>
        </div>

        <div class="header-buttons">
          <button class="sign-header-button">Sign in</button>
          <button class="register-header-button">Register</button>
        </div>

      </div>
    </div> 

    <div class="hotel-picture">
      <img src="img/328838151.jpg" class="pic">
    </div>

    <div class="hotel-content">
      <div class="hotel-name">
        <p>Hotel Name</p>
      </div>

      <div class="hotel-description">
        <p>
          "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua..."
        </p>
      </div>

      <div class="Book-button">
        <button>Book Room</button>
      </div>
    </div>

    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <h2>Book a Room</h2>

        <label for="bookingDate">Select Date</label>
        <input type="date" id="bookingDate">

        <label for="roomSelect">Select Room</label>
        <select id="roomSelect">
          <option value="">Choose a room</option>
          <option value="single">Single Room</option>
          <option value="double">Double Room</option>
          <option value="suite">Suite</option>
        </select>

        <div class="modal-buttons">
          <button id="confirmBooking" class="confirm-btn">Confirm</button>
          <button id="cancelBooking" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

  </body>
</html>
