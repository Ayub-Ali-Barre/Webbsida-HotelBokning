<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel | Aurora Grand Hotels</title>

    <meta name="description" content="Hotel details — Aurora Grand Hotels" />
    <meta property="og:title" content="Aurora — Hotel" />
    <meta property="og:description" content="View details, amenities and book your stay." />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/hotel.css" />
  </head>

  <body>
    <nav class="nav">
      <a href="index.html" class="logo">Aurora</a>
      <div class="menu">
        <a href="hotels.html" class="link">Hotels</a>
        <a href="contact.html" class="link">Contact</a>
        <a href="bookings.html" class="link">My Bookings</a>
      </div>
      <div class="nav_buttons">
        <a href="login.html" class="btn btn-outline">Sign In</a>
        <a href="register.html" class="btn btn-outline">Register</a>
      </div>
    </nav>

    <header class="page-header">
      <div class="container">
        <span class="label" id="hotelCategory">Hotel</span>
        <h1 class="title" id="hotelName">Loading...</h1>
        <p class="sub" id="hotelLocation"></p>
      </div>
    </header>

    <main class="section container">
      <article class="card" style="max-width: 980px; margin: 0 auto">
        <img id="hotelImage" class="card-img" alt="" />

        <div class="card-body">
          <div class="card-row">
            <h3 class="card-name" style="margin: 0">About this stay</h3>
            <span class="card-price" id="hotelPrice"></span>
          </div>

          <p class="card-text" id="hotelDescription"></p>

          <h4 style="margin: 1.5rem 0 0.75rem">Amenities</h4>
          <ul
            id="amenitiesList"
            style="margin: 0 0 1.5rem 1.2rem; color: rgba(255, 255, 255, 0.75)"
          ></ul>

          <button id="openBooking" class="btn btn-outline" style="width: 100%; padding: 1rem">
            Book Room
          </button>
        </div>
      </article>
    </main>

    <!-- Modal (samma id:n som i booking.js för att göra det enkelt) -->
    <div
      id="bookingModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="bookingTitle"
      aria-hidden="true"
    >
      <div class="modal-content">
        <h2 id="bookingTitle">Book a Room</h2>

        <div class="grid-2">
          <div>
            <label for="checkinDate">Check-in</label>
            <input type="date" id="checkinDate" />
          </div>
          <div>
            <label for="checkoutDate">Check-out</label>
            <input type="date" id="checkoutDate" />
          </div>
        </div>

        <label for="roomSelect">Select Room</label>
        <select id="roomSelect">
          <option value="">Choose a room</option>
          <option value="single">Single Room</option>
          <option value="double">Double Room</option>
          <option value="suite">Suite</option>
        </select>

        <div
          id="bookingError"
          class="inline-error"
          role="alert"
          aria-live="polite"
          style="display: none"
        ></div>

        <div id="priceSummary" class="price-summary" style="margin-top: 1rem">
          <div class="price-row"><span>Price / night</span><span id="psNight">-</span></div>
          <div class="price-row"><span>Nights</span><span id="psNights">-</span></div>
          <div class="price-row"><strong>Total</strong><strong id="psTotal">-</strong></div>
        </div>

        <!-- Success Modal -->
        <div
          id="successModal"
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="successTitle"
          aria-hidden="true"
          style="display: none"
        >
          <div class="modal-content">
            <h2 id="successTitle">Booking confirmed ✅</h2>
            <p id="successText" style="color: rgba(255, 255, 255, 0.75); line-height: 1.6"></p>

            <div class="modal-buttons">
              <button id="closeSuccess" class="confirm-btn">Close</button>
              <button id="viewBookings" class="btn btn-outline" style="margin-left: 0.5rem">
                View my bookings
              </button>
            </div>
          </div>
        </div>

        <div class="modal-buttons">
          <button id="confirmBooking" class="confirm-btn">Confirm</button>
          <button id="cancelBooking" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="JS/hotel.js"></script>
    <script type="module" src="JS/nav.js"></script>
  </body>
</html>
