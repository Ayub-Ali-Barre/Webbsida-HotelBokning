name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Node syntax check
        run: |
          npm run check-syntax

      - name: Run ESLint
        run: |
          npm run lint

      - name: Prettier check
        run: |
          npm run format:check
